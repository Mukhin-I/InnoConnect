stages:
  - build
  - test
  - deploy

variables:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

build_backend:
  stage: build
  image: docker:27
  before_script:
    - cp .env.example .env
  script:
    - ls
    - ls backend/db
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml down -v --remove-orphans || true
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml up -d --build --wait

build_frontend:
  stage: build
  image: node:20
  script:
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --output frontend/.env
      "https://$CI_SERVER_FQDN/api/v4/projects/$CI_PROJECT_ID/secure_files/$ENV_FILE_ID/download"
    - cd frontend
    - ls
    - npm install && npm install mapbox-gl react-router-dom
    - npm run build

test:
  stage: test
  image: docker:27
  before_script:
    - cp .env.example .env
  script:
    - ls
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml build
    - echo "Testing"

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feat/36-CI/CD"'
  before_script:
    - apk add --no-cache curl openssh-client
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --output deploy_key
      "https://$CI_SERVER_FQDN/api/v4/projects/$CI_PROJECT_ID/secure_files/$SSH_KEY_FILE_ID/download"
    - chmod 600 deploy_key
    - eval $(ssh-agent -s)
    - ssh-add deploy_key
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /innoconnect && echo ALL OK"
      #&& git pull && docker compose up -d --build && docker compose up -d --build"