stages:
  - build
  - test
  - deploy

variables:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

build_backend:
  stage: build
  image: docker:27
  before_script:
    - cp .env.example .env
  script:
    - ls
    - ls backend/db
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml down -v --remove-orphans || true
    - docker ps -q --filter "publish=8080" | xargs -r docker rm -f || true
    - docker rm -f gateway meeting user request chat db_meeting db_user db_request db_chat 2>/dev/null || true
    - docker system prune -af --volumes
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml up --build --wait --wait-timeout 60
    - docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml logs db_user

build_frontend:
  stage: build
  image: node:20
  script:
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --output frontend/.env
      "https://$CI_SERVER_FQDN/api/v4/projects/$CI_PROJECT_ID/secure_files/$ENV_FILE_ID/download"
    - cd frontend
    - ls
    - npm install && npm install mapbox-gl react-router-dom
    - npm run build

# unit_tests:
#   stage: test
#   image: golang:1.25
#   script:
#     - cd backend
#     - go test ./...

integration_tests:
  stage: test
  image: docker:27

  before_script:
    - export COMPOSE="docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml"
    - cp .env.example .env
    - $COMPOSE down -v --remove-orphans || true

  script:
    - docker info
    - $COMPOSE up -d --build --wait --wait-timeout 90
    - NETWORK=$(docker inspect $($COMPOSE ps -q gateway) --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
    - |
      CID=$(docker create \
        --network "$NETWORK" \
        -e API_BASE_URL=http://gateway:8080 \
        -w /tests \
        python:3.13-alpine \
        sh -c "pip install -q -r requirements.txt && pytest --junitxml=report.xml")

      docker cp backend/tests/. "$CID:/tests"

      docker start -a "$CID"
      TEST_EXIT_CODE=$?

      mkdir -p backend/tests
      docker cp "$CID:/tests/report.xml" backend/tests/report.xml || true

      docker rm "$CID"

      exit $TEST_EXIT_CODE

  after_script:
    - export COMPOSE="docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml"
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        $COMPOSE logs gateway meeting request user chat || true
      fi
    - $COMPOSE down -v --remove-orphans || true

  artifacts:
    when: always
    reports:
      junit: backend/tests/report.xml


deploy:
  stage: deploy
  image: alpine:latest
  environment: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "feat/36-CI/CD"'
  before_script:
    - apk add --no-cache curl openssh-client
    - >
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --output cd
      "https://$CI_SERVER_FQDN/api/v4/projects/$CI_PROJECT_ID/secure_files/$CI_FILE_ID/download"
    - chmod 600 cd
    - eval $(ssh-agent -s)
    - head -1 cd
    - ssh-add cd
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
  - >
    ssh "$DEPLOY_USER@$DEPLOY_HOST" '
      cd innoconnect &&
      git fetch origin main &&
      git checkout main &&
      git reset --hard origin/main &&
      git clean -fd &&
      sudo lsof -ti:80 | xargs -r kill -9 &&
      cp .env.example .env &&
      sed -i "s/localhost/10.93.27.21/g" .env &&
      docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml down &&
      docker compose --env-file .env -f backend/deployment/docker/docker-compose.yml up -d --build &&
      cd frontend &&
      sed -i "s/port: *[0-9]\+/port: 80/" vite.config.js &&
      source ~/.nvm/nvm.sh &&
      nvm use default &&
      (nohup npm run dev >/tmp/frontend.log 2>&1 </dev/null &)
      echo "Started"
      exit 0
    '