basePath: /
definitions:
  entity.CreateMeetingRequest:
    properties:
      address:
        type: string
      description:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      max_people:
        type: integer
      meeting_time:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  entity.CreateRequestRequest:
    properties:
      deadline:
        type: string
      description:
        type: string
      requester_address:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  entity.CreateRequestResponse:
    properties:
      creator:
        $ref: '#/definitions/internal_gateway_entity.User'
      deadline:
        type: string
      description:
        type: string
      id:
        type: integer
      requester_address:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  entity.GetMeetingsResponse:
    properties:
      meetings:
        items:
          $ref: '#/definitions/entity.MeetingShort'
        type: array
    type: object
  entity.GetRequestsResponse:
    properties:
      requests:
        items:
          $ref: '#/definitions/entity.RequestShort'
        type: array
    type: object
  entity.MeetingFull:
    properties:
      address:
        type: string
      creator:
        $ref: '#/definitions/internal_gateway_entity.User'
      current_people:
        type: integer
      description:
        type: string
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      max_people:
        type: integer
      meeting_time:
        type: string
      participants:
        items:
          $ref: '#/definitions/internal_gateway_entity.User'
        type: array
      title:
        type: string
      type:
        type: string
    type: object
  entity.MeetingShort:
    properties:
      address:
        type: string
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      type:
        type: string
    type: object
  entity.RequestFull:
    properties:
      creator:
        $ref: '#/definitions/internal_gateway_entity.User'
      deadline:
        type: string
      description:
        type: string
      request_id:
        type: integer
      requester_address:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  entity.RequestShort:
    properties:
      creator_id:
        type: integer
      deadline:
        type: string
      request_id:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  internal_gateway_entity.User:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  transport.chatMessageRequest:
    properties:
      text:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Innoconnect backend API
  title: Innoconnect API
  version: "1.0"
paths:
  /chats:
    get:
      description: Returns all chats available to the authenticated user
      parameters:
      - description: Bearer JWT token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all chats
      tags:
