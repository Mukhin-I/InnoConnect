      - description: Bearer JWT token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Chat ID
        in: path
        name: chat_id
        required: true
        type: integer
      - description: Message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.chatMessageRequest'
