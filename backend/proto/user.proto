syntax = "proto3";

package user;

option go_package = "pkg/pb/user";

service UserService {

  // POST /register
  rpc Register(RegisterRequest)
      returns (RegisterResponse);

  // POST /login
  rpc Login(LoginRequest)
      returns (LoginResponse);

  // GET /me
  rpc GetCurrentUser(GetCurrentUserRequest)
      returns (User);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string type = 2;
  int32 expires_in = 3;
}

message GetCurrentUserRequest {
  // extracted from JWT by Gateway
  int64 user_id = 1;
}

message User {
  int64 id = 1;
  string email = 2;
  string name = 3;
}